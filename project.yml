name: Stitchwise
options:
  bundleIdPrefix: com.stitchwise
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  StitchCore:
    path: .

targets:
  Stitchwise:
    type: application
    platform: iOS
    sources:
      - path: App/Stitchwise
    dependencies:
      - package: StitchCore
        product: StitchCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.stitchwise.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_CFBundleDisplayName: Stitchwise
        ENABLE_USER_SCRIPT_SANDBOXING: YES

  StitchwiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/StitchwiseUITests
    dependencies:
      - target: Stitchwise

schemes:
  Stitchwise:
    build:
      targets:
        Stitchwise: all
        StitchwiseUITests: [test]
    test:
      targets:
        - StitchwiseUITests
      gatherCoverageData: true

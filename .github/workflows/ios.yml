name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, free, and catches most errors. Runs the whole domain layer on Linux.
  core:
    name: StitchCore (Linux)
    runs-on: ubuntu-latest
    # The official Swift image rather than swift-actions/setup-swift: that action shells
    # out to gpg to verify the toolchain signature and currently fails doing so.
    container: swift:6.3
    steps:
      - uses: actions/checkout@v6
      - run: swift --version
      - run: swift build
      - run: swift test

  app:
    name: App build + UI journey
    runs-on: macos-26
    timeout-minutes: 45
    needs: core
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17", "iPad (A16)"]
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list devicetypes | grep -Ei "iphone|ipad" || true

      - name: Generate the Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      # A cold simulator frequently times out on first app launch, which surfaces as
      # "Timed out while launching application" rather than any fault in the app.
      # Boot it and wait for it to be fully ready before testing.
      - name: Boot the simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)['devices']
          for runtime in sorted(data, reverse=True):
              for dev in data[runtime]:
                  if dev['name'] == '${{ matrix.device }}':
                      print(dev['udid']); raise SystemExit
          ")
          if [ -z "$UDID" ]; then echo "No simulator named '${{ matrix.device }}'"; exit 1; fi
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "SIM_UDID=$UDID" >> $GITHUB_ENV

      - name: Build and run the UI journey
        run: |
          set -o pipefail
          xcodebuild test \
            -project Stitchwise.xcodeproj \
            -scheme Stitchwise \
            -destination "id=$SIM_UDID" \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath "TestResults-${{ matrix.device }}.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcbeautify

      - name: Export screenshots and element trees
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path "TestResults-${{ matrix.device }}.xcresult" \
            --output-path "./ui-artifacts-${{ matrix.device }}" || true
          xcrun xcresulttool get test-results summary \
            --path "TestResults-${{ matrix.device }}.xcresult" --compact \
            > "summary-${{ matrix.device }}.json" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-artifacts-${{ matrix.device }}
          path: |
            ./ui-artifacts-${{ matrix.device }}
            summary-${{ matrix.device }}.json
